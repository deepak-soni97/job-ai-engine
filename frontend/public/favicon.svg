<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Accent Spark Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Inner Shield Glow -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#60A5FA" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Subtle Ambient Glow -->
  <circle cx="32" cy="32" r="18" fill="#38BDF8" opacity="0.18" filter="blur(6px)" />

  <!-- Govt Authority Emblem: Stylized Arch & Pillars -->
  <!-- Roof / Pediment -->
  <path d="M16 26 L32 16 L48 26 Z" fill="url(#shieldGrad)" />
  <rect x="15" y="26.5" width="34" height="2" rx="1" fill="#CBD5E1" />

  <!-- 4 Classical Pillars with AI spacing -->
  <rect x="18" y="30.5" width="4" height="15" rx="1.5" fill="url(#shieldGrad)" />
  <rect x="26" y="30.5" width="4" height="15" rx="1.5" fill="url(#shieldGrad)" />
  <rect x="34" y="30.5" width="4" height="15" rx="1.5" fill="url(#shieldGrad)" />
  <rect x="42" y="30.5" width="4" height="15" rx="1.5" fill="url(#shieldGrad)" />

  <!-- Base Platform -->
  <rect x="14" y="47" width="36" height="3" rx="1.5" fill="url(#shieldGrad)" />

  <!-- Central AI Neural Spark (Intelligence Core) -->
  <circle cx="32" cy="38" r="7" fill="#0F172A" stroke="url(#sparkGrad)" stroke-width="1.8" />
  <path d="M32 33.5 L33.2 36.8 L36.5 38 L33.2 39.2 L32 42.5 L30.8 39.2 L27.5 38 L30.8 36.8 Z" fill="url(#sparkGrad)" />

  <!-- Top Intelligence Beacon -->
  <circle cx="32" cy="14" r="2.2" fill="url(#sparkGrad)" />
  <line x1="32" y1="12" x2="32" y2="8" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" />
</svg>